name = "xcope-roblox"
main = "src/index.mjs"
compatibility_date = "2025-01-01"

# Secrets are NOT stored here. Set them with wrangler:
#   npx wrangler secret put ROBLOX_CLIENT_ID
#   npx wrangler secret put ROBLOX_CLIENT_SECRET
#   npx wrangler secret put ROBLOX_REDIRECT_URI
#   npx wrangler secret put FIREBASE_PROJECT_ID
#
# ALLOWED_ORIGINS is not secret, so it lives here. localhost is included so the
# site can be tested locally.
[vars]
ALLOWED_ORIGINS = "https://mm1f4.github.io,http://127.0.0.1:5500,http://localhost:5500"

[observability]
enabled = true
