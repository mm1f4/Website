name = "xcope-roblox-link"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put ROBLOX_CLIENT_ID
#   wrangler secret put ROBLOX_CLIENT_SECRET
#   wrangler secret put ROBLOX_REDIRECT_URI
#   wrangler secret put FIREBASE_PROJECT_ID
#
# ALLOWED_ORIGINS is not a secret, so it lives here. Add every origin that is
# allowed to call this service, comma separated. localhost is included so the
# site can be tested locally.
[vars]
ALLOWED_ORIGINS = "https://mm1f4.github.io,http://127.0.0.1:5500,http://localhost:5500"

[observability]
enabled = true
